<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Radar WELICI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600;700&family=Saira+Semi+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1788618739">
</head>
<body>
<section id="login" hidden>
  <h1>Radar de Permutas</h1>
  <form id="form-login">
    <input id="email" type="email" placeholder="e-mail" autocomplete="username" required>
    <input id="senha" type="password" placeholder="senha" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <p id="login-erro" class="erro" hidden></p>
  </form>
</section>

<main id="painel" hidden>
  <header>
    <h1>RADAR<span class="marca">WELICI</span></h1>
    <span id="atualizado"></span>
    <button id="novo-cliente" title="Cadastrar cliente">＋ Nova pessoa</button>
    <button id="varrer-agora" title="Varrer OLX e WhatsApp agora (Recepção)">📡 Varrer agora</button>
    <button id="resumo-dia" title="Resumo do dia">🧠 Resumo do dia</button>
    <button id="recarregar" title="Recarregar">↻ Atualizar</button>
    <button id="sair" title="Sair">⎋ Sair</button>
  </header>

  <div id="corpo">
    <nav id="setores" aria-label="Setores">
      <a href="#painel">Painel</a>
      <a href="#recepcao">Recepção</a>
      <a href="#redacao">Redação</a>
      <a href="#expedicao">Expedição</a>
      <a href="#cobranca">Cobrança</a>
      <a href="#garimpo">Garimpo</a>
      <a href="#fiscalizacao">Fiscalização</a>
      <a href="#auditoria">Auditoria</a>
      <a href="#carteira">Carteira</a>
    </nav>
    <section id="setor"></section>
  </div>
</main>

<div id="toast" hidden></div>
<dialog id="ia-dialog">
  <h3 id="ia-titulo"></h3>
  <textarea id="ia-texto" rows="12"></textarea>
  <div class="ia-acoes">
    <button id="ia-copiar">Copiar</button>
    <button id="ia-fila" hidden>+ Fila</button>
    <button id="ia-aplicar" hidden>Aplicar no par</button>
    <button id="ia-fechar">Fechar</button>
  </div>
</dialog>
<dialog id="novo-dialog">
  <h3>Nova pessoa</h3>
  <form id="novo-form">
    <input name="nome" placeholder="Nome (ex: João — casa Vila X)" required>
    <select name="classificacao">
      <option value="indefinido">ainda não sei (indefinido)</option>
      <option value="vip">VIP — completa diferença</option>
      <option value="receptor">receptor — quer menor, recebe volta</option>
      <option value="troca_seca">troca par a par</option>
    </select>
    <input name="o_que_tem_texto" placeholder="O que ele tem (tipo, bairro, cidade)" required>
    <input name="valor_do_que_tem" type="number" placeholder="Valor do imóvel dele (ex: 350000)">
    <input name="o_que_busca" placeholder="O que ele busca">
    <input name="diferenca_max" type="number" placeholder="Quanto adiciona (ex: 100000)">
    <input name="telefone" placeholder="Telefone (se tiver)">
    <input name="link" placeholder="Link do anúncio dele na OLX (se tiver)">
    <div class="ia-acoes">
      <button type="submit" id="novo-salvar">Salvar</button>
      <button type="button" id="novo-fechar">Fechar</button>
    </div>
  </form>
</dialog>
<script type="module" src="js/app.js?v=1788618739"></script>
</body>
</html>
