<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Radar WELICI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" hidden>
  <h1>Radar de Permutas</h1>
  <form id="form-login">
    <input id="email" type="email" placeholder="e-mail" autocomplete="username" required>
    <input id="senha" type="password" placeholder="senha" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <p id="login-erro" class="erro" hidden></p>
  </form>
</section>

<main id="painel" hidden>
  <header>
    <h1>Radar</h1>
    <span id="atualizado"></span>
    <button id="ver-tabela" title="Tabela / Cards">▦</button>
    <button id="resumo-dia" title="Resumo do dia">🧠</button>
    <button id="recarregar" title="Recarregar">↻</button>
    <button id="sair" title="Sair">⎋</button>
  </header>
  <section id="alertas"></section>
  <section id="fila">
    <h2>Fila do dia</h2>
    <div id="fila-lista"></div>
  </section>
  <section id="fila-envio">
    <h2>Fila de envio</h2>
    <div id="fila-envio-lista"></div>
  </section>
  <section id="tabela" hidden><h2>VIPs — visão tabela</h2><div class="rolagem"><table id="tabela-vips"></table></div></section>
  <section id="cards"></section>
</main>

<div id="toast" hidden></div>
<dialog id="ia-dialog">
  <h3 id="ia-titulo"></h3>
  <textarea id="ia-texto" rows="12"></textarea>
  <div class="ia-acoes">
    <button id="ia-copiar">Copiar</button>
    <button id="ia-fila" hidden>+ Fila</button>
    <button id="ia-aplicar" hidden>Aplicar no par</button>
    <button id="ia-fechar">Fechar</button>
  </div>
</dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
